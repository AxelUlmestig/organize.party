name: organize-party-dev

services:
  db:
    build:
      context: .
      dockerfile: db/postgres.Dockerfile
    # Run as current user to avoid problems with file ownership when generating files from inside postgres
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_PASSWORD: postgres
      # POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      TZ: Europe/Stockholm
      PGTZ: Europe/Stockholm
      # sqitch needs a name/email to record who deployed; uid 1000 has no passwd entry inside the container so it cannot fall back to the system user
      SQITCH_FULLNAME: "${SQITCH_FULLNAME:-${USER}}"
      SQITCH_EMAIL: "${SQITCH_EMAIL:-${USER}@localhost}"
    volumes:
      - dbdata:/var/lib/postgresql
      - .:/repo
    working_dir: /repo
    restart: always
    networks:
      - app-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=events
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PASS=postgres
      - AUTH_TYPE=scram-sha-256
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=25
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      - ADMIN_USERS=postgres
      - STATS_USERS=postgres
    depends_on:
      - db
    restart: always
    networks:
      - app-network

  # use this if you want to do frontend dev work without installing Haskell
  dev-webapi:
    image: axelulmestig/organize.party-webapi:latest
    ports:
      - "8081:8081"
    depends_on:
      - db
      - mailhog
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      HOST_URL: "http://localhost:8081"
      SMTP_SERVER: "mailhog"
      SMTP_PORT: 1025
      SMTP_LOGIN: null
      SMTP_PASSWORD: null
    env_file: .env
    volumes:
      - ./frontend:/events/frontend
    networks:
      - app-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    # networks:
    #   - app-network

  filehost:
    image: halverneus/static-file-server:latest
    ports:
      - "8888:8080"
    volumes:
      - ./frontend/test/certs/:/web

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge
