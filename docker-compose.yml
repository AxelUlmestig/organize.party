services:
  db:
    build:
      context: .
      dockerfile: db/postgres.Dockerfile
    # ports:
    #   - "5433:5432"
    environment:
      POSTGRES_DB: events
      POSTGRES_PASSWORD: postgres
      # POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      TZ: Europe/Stockholm
      PGTZ: Europe/Stockholm
    volumes:
      - dbdata:/var/lib/postgresql/data
      - .:/repo
      - ~/.sqitch:/root/.sqitch
    working_dir: /repo
    restart: always
    networks:
      - app-network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    ports:
      - "6432:6432"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=events
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PASS=postgres
      - AUTH_TYPE=scram-sha-256
      - LISTEN_PORT=6432
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=100
      - DEFAULT_POOL_SIZE=25
      - RESERVE_POOL_SIZE=5
      - RESERVE_POOL_TIMEOUT=5
      - IGNORE_STARTUP_PARAMETERS=extra_float_digits
      - ADMIN_USERS=postgres
      - STATS_USERS=postgres
    depends_on:
      - db
    restart: always
    networks:
      - app-network

  server:
    image: axelulmestig/organize.party:${IMAGE_TAG:-0.8}
    ports:
      - "8081:8081"
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
      - mailhog
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      HOST_URL: "http://localhost:8081"
      SMTP_SERVER: "mailhog"
      SMTP_PORT: 1025
      SMTP_LOGIN: null
      SMTP_PASSWORD: null
    env_file: .env
    # volumes:
    #   - ./frontend:/events/frontend
    networks:
      - app-network

  # use this if you want to do frontend dev work without installing Haskell
  dev-server:
    image: axelulmestig/organize.party:${IMAGE_TAG:-0.8}
    ports:
      - "8081:8081"
    depends_on:
      - db
      - mailhog
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      HOST_URL: "http://localhost:8081"
      SMTP_SERVER: "mailhog"
      SMTP_PORT: 1025
      SMTP_LOGIN: null
      SMTP_PASSWORD: null
    env_file: .env
    volumes:
      - ./frontend:/events/frontend
    networks:
      - app-network

  production:
    image: axelulmestig/organize.party:${IMAGE_TAG:-0.8}
    ports:
      - "8081:8081"
    depends_on:
      - db
      - nginx
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      HOST_URL: "https://organize.party"
    env_file: .env
    restart: always
    networks:
      - app-network

  nginx:
    image: nginx:latest
    userns_mode: host
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/mime.types:/etc/nginx/mime.types
      - ./certbot/www/:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    # networks:
    #   - app-network

  nginx-certbot:
    image: nginx:latest
    userns_mode: host
    network_mode: host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx-certbot.conf
      - ./nginx/mime.types:/etc/nginx/mime.types
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/nginx/ssl/:rw
    # networks:
    #   - app-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    depends_on:
      - nginx
    volumes:
      - ./certbot/www/:/var/www/certbot/:rw
      - ./certbot/conf/:/etc/letsencrypt/:rw

volumes:
  dbdata:

networks:
  app-network:
    driver: bridge
